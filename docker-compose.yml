version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-pr-reviewer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: prreviewer
      POSTGRES_PASSWORD: prreviewer_secret
      POSTGRES_DB: ai_pr_reviewer
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai-pr-reviewer-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
